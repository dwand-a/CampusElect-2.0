<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusElect Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #4F7C82;
      --secondary: #93B1B5;
      --accent: #B8E3E9;
      --text: #0B2E33;
      --background: #FFFFFF;
    }

    body {
      margin: 0;
      font-family: rockwell;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--background);
      color: var(--text);
    }

    html {
      font-size: 16px;
      font-weight: 200;
    }

    .container {
      display: flex;
      max-width: 850px;
      width: 95%;
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
      flex-direction: row;
    }

    .left-panel {
      flex: 1;
      background-color: var(--accent);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .left-panel img {
      width: 100%;
      height: 200px;
      max-width: 400px;
      border-radius: 10px;
      border: 2px solid var(--primary);
    }

    .left-panel h2 {
      margin-top: 0.95em;
      color: var(--primary);
      text-align: center;
    }

    .right-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h2 {
      margin-bottom: 10px;
      color: var(--primary);
    }

    .right-panel p {
      color: var(--text);
    }

    .right-panel form {
      display: flex;
      flex-direction: column;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      margin-bottom: 6px;
      display: block;
      font-weight: 500;
      color: var(--text);
    }

    .form-group input {
      width: 85%;
      padding: 10px 35px 10px 35px;
      border-radius: 6px;
      border: 1px solid #ccc;
      color: var(--text);
    }

    .form-group i {
      position: absolute;
      top: 38px;
      left: 10px;
      color: #888;
    }

    .form-group small {
      color: red;
      display: none;
      margin-top: 5px;
    }

    button {
      padding: 12px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.3s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .text-link {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .text-link a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .text-link a:hover {
      color: var(--secondary);
    }

    .footer {
      text-align: center;
      font-size: 0.8em;
      margin-top: 20px;
      color: #555;
    }

    .footer a {
      color: var(--primary);
      margin: 0 8px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer a:hover {
      color: var(--secondary);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left-panel, .right-panel {
        padding: 20px;
      }

      .left-panel img {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left panel -->
    <div class="left-panel">
      <img src="Images/adminimage.jpg" alt="Secure Voting"><br>
      <h2><i class="fas fa-lock"></i> Secure Electronic Voting for Educational Institutions</h2>
    </div>

    <!-- Right panel (Login form) -->
    <div class="right-panel">
      <h2><i class="fas fa-sign-in-alt"></i> Welcome back</h2>
      <p>Sign in to Administration</p>

      <form id="loginForm" onsubmit="return validateForm(event)">
        <div class="form-group">
          <label for="email">Administration email / ID</label>
          <i class="fas fa-user"></i>
          <input type="text" id="email" placeholder="Enter your Administration ID">
          <small id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password">
          <small id="passwordError">Password must be at least 8 characters long.</small>
        </div>

        <div class="text-link"><a href="#"><i class="fas fa-key"></i> Forgot password?</a></div>

        <button type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>

      </form>

      <div class="footer">
        <a href="#"><i class="fas fa-shield-alt"></i> Privacy Policy</a> |
        <a href="#"><i class="fas fa-file-contract"></i> Terms of Service</a> |
        <a href="#"><i class="fas fa-question-circle"></i> Help Center</a><br>
        <br>© 2024 CampusElect. All rights reserved.
      </div>
    </div>
  </div>

  <!-- JavaScript validation -->
  <script>
    function validateForm(event) {
      event.preventDefault(); // Stop form from submitting immediately

      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      let valid = true;
      const emailValue = email.value.trim();

      // Reset errors
      emailError.style.display = "none";
      passwordError.style.display = "none";

      // Validation for email or numeric ID
      if (emailValue.endsWith("@admin.edu.jm")) {
        emailError.style.display = "none"; // Valid email
      } else if (/^\d+$/.test(emailValue)) {
        if (emailValue.length !== 8) {
          emailError.textContent = "Administration ID must be exactly 8 digits.";
          emailError.style.display = "block";
          valid = false;
        }
      } else {
        emailError.textContent = "Please enter a valid email ending with @admin.edu.jm or an 8-digit ID.";
        emailError.style.display = "block";
        valid = false;
      }

      // Password validation
      if (!password.value || password.value.length < 8) {
        passwordError.style.display = "block";
        valid = false;
      }

      // If valid, show popup and redirect
      if (valid) {
        alert("Login Successful!");
        window.location.href = "AdminPage.html"; // Redirect to Admin Dashboard
      }

      return false;
    }
  </script>

</body>
</html>
